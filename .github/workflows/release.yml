name: Release

# Builds a universal macOS .dmg, signs the updater bundle, and publishes a
# draft GitHub Release with the auto-updater manifest (latest.json).
#
# Trigger by pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# or run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Must already exist.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary = Intel + Apple Silicon in one .dmg.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (required for auto-update) ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- Apple Developer ID signing + notarization (optional) ---
          # If these secrets are absent, tauri-action builds an UNSIGNED app
          # (users right-click -> Open on first launch). Add them later to get
          # a notarized, double-clickable .dmg with no workflow changes.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Notch __VERSION__'
          releaseBody: 'See the assets below to download and install Notch.'
          # Draft so you can review before it becomes "latest" (the updater only
          # sees published releases). Publish from the Releases page when ready.
          releaseDraft: true
          prerelease: false
          # Generates latest.json and uploads it as a release asset.
          includeUpdaterJson: true
          args: --target universal-apple-darwin
